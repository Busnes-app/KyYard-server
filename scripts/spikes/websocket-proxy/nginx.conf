events {}
http {
  # Forward the Upgrade handshake only when the client asked for one; ordinary requests keep
  # upstream keepalive. This is the two-part snippet the README ships for the control plane.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  server {
    listen 127.0.0.1:8082;
    location / {
      proxy_pass http://127.0.0.1:8090;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # proxy_read_timeout stays at its 60 s default on purpose; the heartbeat must beat it.
    }
  }
}
