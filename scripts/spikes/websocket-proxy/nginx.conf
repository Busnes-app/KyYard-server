events {}
http {
  server {
    listen 8082;
    location / {
      proxy_pass http://127.0.0.1:8090;
      # nginx does not forward the Upgrade handshake by default; these two lines are the
      # minimum an operator must add. proxy_read_timeout stays at its 60 s default on purpose.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
