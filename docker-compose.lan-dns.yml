# Optional override: send the container's DNS lookups to your LAN's resolver, so names that
# exist only there (a KyRecovery behind your own proxy) resolve inside the container. It
# replaces the host's resolvers for every lookup this container makes, which is why it is
# not in the base file. Select it by adding it to COMPOSE_FILE in .env, never with -f: an
# explicit -f list replaces COMPOSE_FILE outright. The snippet appends this file to whatever
# chain .env already has (build overlay, local override) and touches nothing else; the
# resolver and the private-recovery flag sit next to it: the resolver comes from an exported
# KY_DNS (`export KY_DNS=<addr>`; fish `set -x KY_DNS <addr>`) or, when that is unset, from the KY_DNS line
# already in .env; there is no default, the block refuses to guess. An exported value overrides
# .env, so re-running is a no-op only while KY_DNS is unset in your shell; the flag is set to true.
# The flag persists in .env on its own: undo with the README's revert, not by editing this line.
#   (umask 077; touch .env \
#     && cf=$({ grep '^COMPOSE_FILE=' .env || [ $? -eq 1 ]; } | tail -n1 | cut -d= -f2-) && cf=${cf:-docker-compose.yml} \
#     && dns=${KY_DNS:-$({ grep '^KY_DNS=' .env || [ $? -eq 1 ]; } | tail -n1 | cut -d= -f2-)} \
#     && : "${dns:?no resolver chosen: export KY_DNS=<your LAN resolver> (fish: set -x KY_DNS <addr>), then re-run this block}" \
#     && case ":$cf:" in *:docker-compose.lan-dns.yml:*) ;; *) cf="$cf:docker-compose.lan-dns.yml";; esac \
#     && t=$(mktemp ./.env.XXXXXX) && { grep -v -e '^COMPOSE_FILE=' -e '^KY_DNS=' -e '^KY_BACKUP_ALLOW_PRIVATE_RECOVERY=' .env || [ $? -eq 1 ]; } > "$t" \
#     && printf 'COMPOSE_FILE=%s\nKY_DNS=%s\nKY_BACKUP_ALLOW_PRIVATE_RECOVERY=true\n' "$cf" "$dns" >> "$t" && mv "$t" .env)
#   docker compose up -d --force-recreate
services:
  app:
    dns:
      - ${KY_DNS:?set KY_DNS to your LAN DNS server}
