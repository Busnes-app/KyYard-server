# Optional database. SQLite remains the only database supported by capsule backups.
services:
  kyyard:
    network_mode: !reset null
    networks: [default]
    environment:
      - KY_DB_DRIVER=postgres
      - KY_DB_DSN=${KY_DB_DSN:?Set a PostgreSQL DSN with sslmode=verify-full and sslrootcert=/etc/kyyard-db-ca.crt}
    volumes:
      - ${KY_POSTGRES_TLS_DIR:?Set the absolute PostgreSQL TLS directory}/ca.crt:/etc/kyyard-db-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
  # One-shot move from PostgreSQL 17 (docs/RUNNING.md): dumps the old pgdata volume once into
  # the new one, which postgres restores on its next start. The 17 data is only read.
  postgres-17-dump:
    image: postgres:17.12-alpine3.24@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    network_mode: none
    restart: "no"
    entrypoint: ["bash", "/ky/postgres-17-to-18.sh", "dump"]
    environment:
      POSTGRES_USER: kyyard
      OLD: /var/lib/postgresql/data
      NEW: /pg18
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres:/pg18
      - ./scripts/postgres-17-to-18.sh:/ky/postgres-17-to-18.sh:ro
  postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    entrypoint: ["bash", "/ky/postgres-17-to-18.sh", "restore"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key"]
    environment:
      POSTGRES_USER: kyyard
      POSTGRES_PASSWORD: ${KY_POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: kyyard
    volumes:
      - postgres:/var/lib/postgresql
      - ${KY_POSTGRES_TLS_DIR:?Set the absolute PostgreSQL TLS directory}:/tls:ro
      - ./scripts/postgres-17-to-18.sh:/ky/postgres-17-to-18.sh:ro
    depends_on:
      postgres-17-dump:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyyard -d kyyard"]
      interval: 5s
      timeout: 3s
      retries: 10
      # The first start after the move restores the dump; that takes time with the data size.
      start_period: 1h
volumes:
  # PostgreSQL 17's data, kept for rollback; only postgres-17-dump reads it.
  pgdata:
  postgres:
