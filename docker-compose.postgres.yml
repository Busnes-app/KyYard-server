# Optional database. SQLite remains the only database supported by capsule backups.
services:
  kyyard:
    environment:
      - KY_DB_DRIVER=postgres
      - KY_DB_DSN=${KY_DB_DSN:?Set a PostgreSQL DSN using host postgres and your password}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyyard
      POSTGRES_PASSWORD: ${KY_POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: kyyard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyyard -d kyyard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
