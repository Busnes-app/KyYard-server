# The reverse proxy is a container on this host (Nginx Proxy Manager, Caddy, Traefik).
#
# Add this to COMPOSE_FILE after docker-compose.proxy.yml and set KY_PROXY_NETWORK to the
# network the proxy container is already on. The proxy then reaches KyYard by its container
# name, and the host port goes away entirely.
#
# The base file publishes 127.0.0.1:9273, which a proxy in a container cannot reach: inside it,
# 127.0.0.1 is the proxy's own container, so the request fails and the proxy answers 502. The
# answer is not to publish the port more widely -- that would put plain HTTP on the network for
# anyone to reach -- but to stop publishing it at all and let the two containers talk directly.
#
# Point the proxy at http://kyyard:9273, and enable its websocket support: the agent
# connection and, later, the browser terminal are both websockets.
services:
  kyyard:
    # Nothing on the host, nothing on the network: the proxy is the only thing that can reach
    # this server, which is what the reverse proxy was for.
    ports: !reset []
    networks:
      - default
      - proxy

networks:
  proxy:
    name: ${KY_PROXY_NETWORK:?Set the network your reverse proxy container is on (docker network ls)}
    external: true
